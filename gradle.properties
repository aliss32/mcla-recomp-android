# LibertyRecomp Android — Gradle/AndroidX/Kotlin defaults.

# JVM heap — adjusted for CI runner limits
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false

# AndroidX + Jetifier (Jetifier off: we don't use any Support Library deps).
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R class reduces incremental build times.
android.nonTransitiveRClass=true

# Native build parallelism handed to CMake/Ninja.
org.gradle.parallel=true
org.gradle.caching=true

# Warn instead of erroring on R8 legacy-lambda shrinker edge cases.
android.suppressUnsupportedCompileSdk=35
