name: Build MCLA Android APK (Vulkan & Turnip Driver Support)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26d
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake

      - name: Clone SDL3
        run: |
          git clone --depth=1 --branch release-3.2.14 https://github.com/libsdl-org/SDL.git /tmp/SDL3

      - name: Build SDL3 for Android ARM64
        run: |
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL3-build --parallel $(nproc)
          # Stage the built library
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/SDL3-build/libSDL3.so app/src/main/jniLibs/arm64-v8a/libSDL3.so
          echo "SDL3 staged successfully:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Stage NDK runtime (libc++_shared.so)
        run: |
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          SYSROOT_LIB=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android
          cp $SYSROOT_LIB/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          echo "NDK runtime staged:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Build Driver Proxy (Turnip / Vulkan Loader Hook)
        run: |
          bash scripts/build_driver_proxy.sh || true

      - name: Build MCLA Native Library
        run: |
          bash scripts/build_native.sh || true

      - name: Assemble Android APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-Android-Vulkan-Turnip-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
