name: Build MCLA Android APK (Vulkan & Turnip Driver Support)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Build Driver Proxy (Turnip / Vulkan Loader Hook)
        run: |
          bash scripts/build_driver_proxy.sh

      - name: Build MCLA Native Library
        run: |
          bash scripts/build_native.sh || true

      - name: Assemble Android APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-Android-Vulkan-Turnip-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
