name: Build MCLA Android APK (Vulkan & Turnip Driver Support)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r26d
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install build tools
        run: sudo apt-get install -y ninja-build

      - name: Clone SDL3
        run: git clone --depth=1 --branch release-3.2.14 https://github.com/libsdl-org/SDL.git /tmp/SDL3

      - name: Build SDL3 arm64-v8a
        run: |
          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL3-build --parallel $(nproc)
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/SDL3-build/libSDL3.so app/src/main/jniLibs/arm64-v8a/

      - name: Stage libc++_shared.so
        run: |
          cp $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
             app/src/main/jniLibs/arm64-v8a/

      - name: Grant permissions
        run: chmod +x gradlew scripts/*.sh

      - name: Build driver proxy
        run: bash scripts/build_driver_proxy.sh || true

      - name: Build MCLA native
        run: bash scripts/build_native.sh || true

      - name: Assemble APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MCLA-Android-Vulkan-Turnip-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
